<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hand Figure</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --card:#f0f0f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f5; --card:#222222; }
  }
  :root { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; }
  h1 { font-size:1.1rem; margin:10px 0 4px; }
  button { font-size:1rem; padding:10px 16px; border:0; border-radius:10px; background:#2563eb; color:#fff; margin:6px 4px; }
  button.sec { background:var(--card); color:var(--fg); }
  #stage { position:relative; width:100%; max-width:640px; margin:6px auto; background:#000; display:none; overflow:hidden; border-radius:12px; }
  #video, #hand, #gl { position:absolute; left:0; top:0; width:100%; height:100%; }
  #video { object-fit:cover; transform:scaleX(-1); filter:brightness(.75); }
  #hud { position:absolute; left:8px; bottom:6px; right:8px; text-align:left; color:#fff; font-size:12px; text-shadow:0 0 4px #000; pointer-events:none; }
  small { display:block; margin:6px 14px; opacity:.8; line-height:1.5; }
</style>
</head>
<body>
<h1>Hand Figure</h1>
<button id="start">Kamerani yoqish</button>
<button id="swap" class="sec" style="display:none">Qo'llarni almashtirish</button>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="hand"></canvas>
  <canvas id="gl"></canvas>
  <div id="hud">Qo'lni ko'rsating</div>
</div>

<small>
  <b>Asosiy qo'l (ekranda o'ngdagi):</b> 2 barmoq = to'rtburchak, 3 = uchburchak, 4 = kub, 5 = 5 burchakli shakl.<br>
  <b>Ikkinchi qo'l:</b> bosh va ko'rsatkich barmoqni yaqinlashtirib/uzoqlashtirib o'lchamni o'zgartiring.<br>
  Shakl doim aylanadi va qo'l harakatiga ergashadi.
</small>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video = document.getElementById('video');
const stage = document.getElementById('stage');
const glCv = document.getElementById('gl');
const handCv = document.getElementById('hand');
const hctx = handCv.getContext('2d');
const hud = document.getElementById('hud');
const swapBtn = document.getElementById('swap');

let swapped = false;
swapBtn.onclick = () => { swapped = !swapped; };

/* ---------- Three.js ---------- */
let renderer, scene, camera, W = 1, H = 1, aspect = 1;

function resize() {
  W = stage.clientWidth; H = stage.clientHeight;
  aspect = W / H;
  handCv.width = W; handCv.height = H;
  if (renderer) {
    renderer.setSize(W, H, false);
    camera.left = -aspect; camera.right = aspect;
    camera.updateProjectionMatrix();
  }
}

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: glCv, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
  resize();
}
window.addEventListener('resize', resize);

const SHAPES = {
  2: { color: 0x35e0ff, make: () => new THREE.BoxGeometry(1.3, 0.85, 0.08) },
  3: { color: 0xffe135, make: () => { const g = new THREE.CylinderGeometry(0.85, 0.85, 0.1, 3); g.rotateX(Math.PI / 2); return g; } },
  4: { color: 0xff8a1f, make: () => new THREE.BoxGeometry(1, 1, 1) },
  5: { color: 0xff4fd8, make: () => new THREE.DodecahedronGeometry(0.75) }
};

const TRAIL = 9;
let main = null, ghosts = [], curN = 0, curEdges = null;
const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 6);

function clearShape() {
  if (main) {
    scene.remove(main);
    main.traverse(c => { if (c.material) c.material.dispose(); });
  }
  ghosts.forEach(g => { scene.remove(g); g.material.dispose(); });
  main = null; ghosts = [];
}

// Qirralarni yo'g'on (nurli) naychalar qilib yasaydi
function thickEdges(eg, color, radius, opacity) {
  const grp = new THREE.Group();
  const pos = eg.attributes.position;
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false
  });
  const a = new THREE.Vector3(), b = new THREE.Vector3(), dir = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < pos.count; i += 2) {
    a.fromBufferAttribute(pos, i);
    b.fromBufferAttribute(pos, i + 1);
    dir.subVectors(b, a);
    const len = dir.length();
    if (len < 1e-5) continue;
    const m = new THREE.Mesh(cylGeo, mat);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.scale.set(radius, len + radius * 1.5, radius);
    m.quaternion.setFromUnitVectors(up, dir.normalize());
    grp.add(m);
  }
  return grp;
}

function buildShape(n) {
  clearShape();
  const cfg = SHAPES[n];
  const eg = new THREE.EdgesGeometry(cfg.make());
  curEdges = eg;
  const core = new THREE.Color(cfg.color).lerp(new THREE.Color(0xffffff), 0.45);

  main = new THREE.Group();
  main.add(thickEdges(eg, cfg.color, 0.12, 0.28));  // tashqi nur
  main.add(thickEdges(eg, cfg.color, 0.06, 0.65));  // o'rta nur
  main.add(thickEdges(eg, core, 0.025, 1));         // yorqin o'zak
  scene.add(main);

  for (let i = 0; i < TRAIL; i++) {
    const g = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({
      color: cfg.color, transparent: true, opacity: 0.8 * (1 - i / TRAIL),
      blending: THREE.AdditiveBlending, depthTest: false
    }));
    g.visible = false;
    scene.add(g);
    ghosts.push(g);
  }
  curN = n;
  hist.length = 0;
}

/* ---------- Holat ---------- */
const cur = { x: 0, y: 0 }, tgt = { x: 0, y: 0 };
const rot = { x: 0.4, y: 0.2, z: 0 };
let scaleCur = 1, scaleTgt = 1;
let visible = false, wasVisible = false;
const hist = [];

let stable = 0, pending = 0, pendingFrames = 0;
let noHandFrames = 0;
let fps = 0, frames = 0, lastFpsT = performance.now();

/* ---------- Qo'l yordamchilari ---------- */
const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
const dxy = (a, b) => Math.hypot((a.x - b.x) * aspect, a.y - b.y);

function countFingers(lm) {
  const size = d3(lm[0], lm[9]);
  let n = 0;
  if (d3(lm[4], lm[5]) > size * 0.55) n++;
  [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([tip, pip]) => {
    if (d3(lm[tip], lm[0]) > d3(lm[pip], lm[0]) * 1.1) n++;
  });
  return n;
}

/* ---------- MediaPipe ---------- */
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults(res => {
  hctx.clearRect(0, 0, W, H);
  const hs = res.multiHandLandmarks || [];

  frames++;
  const now = performance.now();
  if (now - lastFpsT > 1000) { fps = Math.round(frames * 1000 / (now - lastFpsT)); frames = 0; lastFpsT = now; }

  if (!hs.length) {
    noHandFrames++;
    if (noHandFrames > 10) visible = false;
    hud.textContent = `Qo'l topilmadi · ${fps} fps`;
    return;
  }
  noHandFrames = 0;

  hctx.save();
  hctx.translate(W, 0); hctx.scale(-1, 1);
  hs.forEach(lm => {
    drawConnectors(hctx, lm, HAND_CONNECTIONS, { color: 'rgba(255,255,255,0.55)', lineWidth: 1 });
    drawLandmarks(hctx, lm, { color: 'rgba(255,255,255,0.8)', radius: 1.5 });
  });
  hctx.restore();

  const arr = hs.map(lm => ({ lm, x: 1 - lm[0].x })).sort((a, b) => a.x - b.x);
  let dom, other = null;
  if (arr.length === 1) {
    dom = arr[0];
  } else {
    dom = swapped ? arr[0] : arr[arr.length - 1];
    other = swapped ? arr[arr.length - 1] : arr[0];
  }

  const c = countFingers(dom.lm);
  if (c === pending) pendingFrames++; else { pending = c; pendingFrames = 1; }
  if (pendingFrames >= 4) stable = c;

  if (SHAPES[stable]) {
    if (stable !== curN) buildShape(stable);
    visible = true;
    const p = dom.lm[9];
    tgt.x = ((1 - p.x) * 2 - 1) * aspect;
    // Shakl qo'lning tepasida turadi
    tgt.y = Math.min(0.8, (1 - p.y * 2) + 0.4 + 0.2 * scaleCur);
  } else {
    visible = false;
  }

  let scaleText = "yo'q";
  if (other) {
    const l = other.lm;
    const pinch = dxy(l[4], l[8]) / Math.max(dxy(l[0], l[9]), 0.001);
    const t = Math.min(1, Math.max(0, (pinch - 0.15) / 0.85));
    scaleTgt = 0.5 + t * 2.0;
  }
  if (other) scaleText = `o'lcham ×${scaleCur.toFixed(2)}`;

  hud.textContent = `Asosiy qo'l: ${stable} · Ikkinchi qo'l: ${scaleText} · ${fps} fps`;
});

/* ---------- Chizish sikli ---------- */
let lastT = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  if (!renderer) return;
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (main) {
    if (visible && !wasVisible) { cur.x = tgt.x; cur.y = tgt.y; hist.length = 0; }
    wasVisible = visible;
    main.visible = visible;

    cur.x += (tgt.x - cur.x) * 0.18;
    cur.y += (tgt.y - cur.y) * 0.18;
    scaleCur += (scaleTgt - scaleCur) * 0.2;
    rot.x += 0.8 * dt; rot.y += 1.2 * dt; rot.z += 0.3 * dt;

    const s = 0.35 * scaleCur;
    main.position.set(cur.x, cur.y, 0);
    main.rotation.set(rot.x, rot.y, rot.z);
    main.scale.setScalar(s);

    hist.push({ x: cur.x, y: cur.y, rx: rot.x, ry: rot.y, rz: rot.z, s });
    if (hist.length > TRAIL * 2 + 4) hist.shift();

    ghosts.forEach((g, i) => {
      const h = hist[hist.length - 1 - (i + 1) * 2];
      if (visible && h) {
        g.visible = true;
        g.position.set(h.x, h.y, 0);
        g.rotation.set(h.rx, h.ry, h.rz);
        g.scale.setScalar(h.s);
      } else g.visible = false;
    });
  }
  renderer.render(scene, camera);
}

/* ---------- Boshlash ---------- */
document.getElementById('start').onclick = () => {
  document.getElementById('start').style.display = 'none';
  const portrait = window.innerHeight > window.innerWidth;
  video.addEventListener('loadedmetadata', () => {
    stage.style.display = 'block';
    stage.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
    swapBtn.style.display = 'inline-block';
    initThree();
    requestAnimationFrame(loop);
  }, { once: true });
  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    facingMode: 'user',
    width: portrait ? 480 : 640,
    height: portrait ? 640 : 480
  });
  cam.start();
};
</script>
</body>
</html>
