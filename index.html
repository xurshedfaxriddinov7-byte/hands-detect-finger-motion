<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Finger Motion</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --card:#f0f0f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111111; --fg:#f5f5f5; --card:#222222; }
  }
  :root { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; }
  h1 { font-size:1.2rem; margin:12px 0; }
  #wrap { position:relative; width:100%; max-width:480px; margin:0 auto; }
  video, canvas { width:100%; display:block; border-radius:12px; }
  canvas { position:absolute; top:0; left:0; }
  video { transform:scaleX(-1); }
  #info { background:var(--card); border-radius:12px; margin:12px; padding:12px; font-size:1.1rem; }
  button { font-size:1rem; padding:10px 20px; border:0; border-radius:10px; background:#2563eb; color:#fff; }
</style>
</head>
<body>
<h1>Qo'l va barmoq harakati</h1>
<button id="start">Kamerani yoqish</button>
<div id="wrap" style="margin-top:12px">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="info">
  <div>Barmoqlar: <b id="fingers">-</b></div>
  <div>Harakat: <b id="motion">-</b></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fingersEl = document.getElementById('fingers');
const motionEl = document.getElementById('motion');
const history = [];

function countFingers(lm, label) {
  let n = 0;
  // Bosh barmoq
  if (label === 'Right' ? lm[4].x < lm[3].x : lm[4].x > lm[3].x) n++;
  // Qolgan barmoqlar
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip, pip]) => {
    if (lm[tip].y < lm[pip].y) n++;
  });
  return n;
}

function detectMotion() {
  if (history.length < 8) return "Harakat yo'q";
  const a = history[0], b = history[history.length - 1];
  const dx = (b.x - a.x) * canvas.width;
  const dy = (b.y - a.y) * canvas.height;
  const t = 40;
  if (Math.abs(dx) < t && Math.abs(dy) < t) return "Harakat yo'q";
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "O'ngga" : "Chapga";
  return dy > 0 ? "Pastga" : "Yuqoriga";
}

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(res => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Video aks ettirilgan, canvasni ham aks ettiramiz
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  if (res.multiHandLandmarks && res.multiHandLandmarks.length) {
    const lm = res.multiHandLandmarks[0];
    // Old kamera aks ettirilgani uchun chap/o'ngni almashtiramiz
    const raw = res.multiHandedness[0].label;
    const label = raw === 'Right' ? 'Left' : 'Right';

    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color:'#00ff00', lineWidth:3 });
    drawLandmarks(ctx, lm, { color:'#ff0000', radius:3 });

    history.push({ x: lm[8].x, y: lm[8].y });
    if (history.length > 10) history.shift();

    fingersEl.textContent = countFingers(lm, label);
    motionEl.textContent = detectMotion();
  } else {
    history.length = 0;
    fingersEl.textContent = '-';
    motionEl.textContent = '-';
  }
  ctx.restore();
});

document.getElementById('start').onclick = async () => {
  const cam = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    facingMode: 'user',
    width: 640,
    height: 480
  });
  cam.start();
};
</script>
</body>
</html>
