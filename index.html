<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hand Figure</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --card:#f0f0f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f5; --card:#222222; }
  }
  :root { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; }
  h1 { font-size:1.1rem; margin:10px 0 4px; }
  button { font-size:1rem; padding:10px 16px; border:0; border-radius:10px; background:#2563eb; color:#fff; margin:6px 4px; }
  button.sec { background:var(--card); color:var(--fg); }
  #stage { position:relative; width:100%; max-width:640px; margin:6px auto; background:#000; display:none; overflow:hidden; border-radius:12px; }
  #video, #hand, #gl { position:absolute; left:0; top:0; width:100%; height:100%; }
  #video { object-fit:cover; transform:scaleX(-1); filter:brightness(.75); }
  #hud { position:absolute; left:8px; bottom:6px; right:8px; text-align:left; color:#fff; font-size:12px; text-shadow:0 0 4px #000; pointer-events:none; }
  small { display:block; margin:6px 14px; opacity:.8; line-height:1.5; }
</style>
</head>
<body>
<h1>Hand Figure</h1>
<button id="start">Kamerani yoqish</button>
<button id="swap" class="sec" style="display:none">Qo'llarni almashtirish</button>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="hand"></canvas>
  <canvas id="gl"></canvas>
  <div id="hud">Qo'lni ko'rsating</div>
</div>

<small>
  <b>Asosiy qo'l (ekranda o'ngdagi):</b> 2 barmoq = to'rtburchak, 3 = uchburchak, 4 = kub, 5 = 5 burchakli shakl.<br>
  <b>Ikkinchi qo'l:</b> bosh va ko'rsatkich barmoqni yaqinlashtirib/uzoqlashtirib o'lchamni o'zgartiring.<br>
  Shakl doim aylanadi va qo'l harakatiga ergashadi.
</small>

swapBtn.onclick = () => { swapped = !swapped; };

let renderer, scene, camera, W = 1, H = 1, aspect = 1;

function resize() {
  W = stage.clientWidth; H = stage.clientHeight;
  aspect = W / H;
  handCv.width = W; handCv.height = H;
  if (renderer) {
    renderer.setSize(W, H, false);
    camera.left = -aspect; camera.right = aspect;
    camera.updateProjectionMatrix();
  }
}

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: glCv, alpha: true, antialias: true });

  resize();
}
