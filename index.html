<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hand Figure</title>

<style>
:root {
  --bg: #000;
  --fg: #fff;
  --card: #202020;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, sans-serif;
  text-align: center;
}
h1 { font-size: 20px; margin: 12px 0 6px; }
button, select {
  font-size: 15px;
  padding: 10px 13px;
  border: 0;
  border-radius: 10px;
  margin: 4px;
}
button { background: #2563eb; color: white; }
.sec { background: var(--card); color: white; }
#stage {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 8px auto;
  background: #000;
  overflow: hidden;
  display: none;
}
#video, #hand, #gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#video {
  object-fit: cover;
  transform: scaleX(-1);
  filter: brightness(.75);
}
#hud {
  position: absolute;
  left: 8px;
  bottom: 8px;
  color: white;
  font-size: 12px;
  text-align: left;
  text-shadow: 0 0 5px black;
  pointer-events: none;
}
small {
  display: block;
  margin: 10px 14px;
  line-height: 1.7;
  opacity: .9;
}
</style>
</head>

<body>
<h1>Hand Figure ❤️</h1>

<button id="start">Kamerani yoqish</button>
<button id="swap" class="sec" style="display:none">Qo‘llarni almashtirish</button>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="hand"></canvas>
  <canvas id="gl"></canvas>
  <div id="hud">Qo‘lni ko‘rsating</div>
</div>

<small>
  ☝️ 1 barmoq — to‘rtburchakli list<br>
  ❤️ 2 barmoq — qizil 3D neon yurak<br>
  🔺 3 barmoq — uchburchak<br>
  🧊 4 barmoq — kub<br>
  ⭐ 5 barmoq — beshburchakli shakl<br>
  Musht — shaklni yashirish<br>
  Ikkinchi qo‘lning bosh va ko‘rsatkich barmoqlari bilan o‘lchamni boshqaring.
</small>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("video");
const stage = document.getElementById("stage");
const glCv = document.getElementById("gl");
const handCv = document.getElementById("hand");
const ctx = handCv.getContext("2d");
const hud = document.getElementById("hud");

let renderer, scene, camera;
let W = 1, H = 1, aspect = 1;
let swapped = false;
let main = null, ghosts = [];
let currentShape = 0;
let visible = false, wasVisible = false;
let stable = 0, pending = -1, pendingFrames = 0;
let scaleCur = 1, scaleTarget = 1;
let fps = 0, frames = 0, lastFps = performance.now();
let noHandFrames = 0;

const cur = { x: 0, y: 0 };
const target = { x: 0, y: 0 };
const rot = { x: 0.4, y: 0.2, z: 0 };
const history = [];
const TRAIL = 9;

const fingerDistance = (a, b) =>
  Math.hypot(a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0));

const screenDistance = (a, b) =>
  Math.hypot((a.x-b.x)*aspect, a.y-b.y);

function resize() {
  if (!stage.clientWidth || !stage.clientHeight) return;

  W = stage.clientWidth;
  H = stage.clientHeight;
  aspect = W / H;

  handCv.width = W;
  handCv.height = H;

  if (renderer) {
    renderer.setSize(W, H, false);
    camera.left = -aspect;
    camera.right = aspect;
    camera.top = 1;
    camera.bottom = -1;
    camera.updateProjectionMatrix();
  }
}

function initThree() {
  renderer = new THREE.WebGLRenderer({
    canvas: glCv,
    alpha: true,
    antialias: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  scene = new THREE.Scene();

  camera = new THREE.OrthographicCamera(
    -1, 1, 1, -1, -10, 10
  );

  resize();
}

window.addEventListener("resize", resize);

function makeHeartGeometry() {
  const s = new THREE.Shape();

  s.moveTo(0, -0.65);
  s.bezierCurveTo(-0.25, -0.38, -0.85, 0.05, -0.85, 0.48);
  s.bezierCurveTo(-0.85, 1.02, -0.15, 1.08, 0, 0.55);
  s.bezierCurveTo(0.15, 1.08, 0.85, 1.02, 0.85, 0.48);
  s.bezierCurveTo(0.85, 0.05, 0.25, -0.38, 0, -0.65);

  const g = new THREE.ExtrudeGeometry(s, {
    depth: 0.22,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: 0.045,
    bevelThickness: 0.045,
    curveSegments: 16
  });

  g.center();
  return g;
}

const SHAPES = {
  1: {
    color: 0x35e0ff,
    make: () => new THREE.BoxGeometry(1.35, 0.9, 0.055)
  },

  2: {
    color: 0xff102f,
    make: makeHeartGeometry
  },

  3: {
    color: 0xffe135,
    make: () => {
      const g = new THREE.CylinderGeometry(0.85, 0.85, 0.1, 3);
      g.rotateX(Math.PI / 2);
      return g;
    }
  },

  4: {
    color: 0xff8a1f,
    make: () => new THREE.BoxGeometry(1, 1, 1)
  },

  5: {
    color: 0xff4fd8,
    make: () => new THREE.CylinderGeometry(0.8, 0.8, 0.15, 5)
  }
};

const cylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 6);

function thickEdges(geometry, color, radius, opacity) {
  const group = new THREE.Group();
  const positions = geometry.attributes.position;

  const material = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false
  });

  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const dir = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < positions.count; i += 2) {
    a.fromBufferAttribute(positions, i);
    b.fromBufferAttribute(positions, i + 1);

    dir.subVectors(b, a);
    const len = dir.length();

    if (len < 0.00001) continue;

    const mesh = new THREE.Mesh(cylinderGeo, material);
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    mesh.scale.set(radius, len + radius * 1.5, radius);
    mesh.quaternion.setFromUnitVectors(up, dir.normalize());

    group.add(mesh);
  }

  return group;
}

function clearShape() {
  if (main) {
    scene.remove(main);

    main.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();

      if (obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach(m => m.dispose());
        } else {
          obj.material.dispose();
        }
      }
    });
  }

  ghosts.forEach(g => {
    scene.remove(g);
    g.geometry.dispose();
    g.material.dispose();
  });

  main = null;
  ghosts = [];
}

function buildShape(n) {
  clearShape();

  const cfg = SHAPES[n];
  if (!cfg) return;

  const geometry = cfg.make();
  const edgeGeometry = new THREE.EdgesGeometry(geometry);

  const coreColor = new THREE.Color(cfg.color)
    .lerp(new THREE.Color(0xffffff), 0.45);

  main = new THREE.Group();

  // Yurakning ichki qismi ham qizil bo‘lib ko‘rinadi.
  if (n === 2) {
    const fill = new THREE.Mesh(
      geometry,
      new THREE.MeshBasicMaterial({
        color: 0xff102f,
        transparent: true,
        opacity: 0.42,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );

    main.add(fill);
  }

  // Neon tashqi nur, o‘rta nur va yorqin o‘zak.
  main.add(thickEdges(edgeGeometry, cfg.color, 0.12, 0.28));
  main.add(thickEdges(edgeGeometry, cfg.color, 0.06, 0.72));
  main.add(thickEdges(edgeGeometry, coreColor, 0.025, 1));

  scene.add(main);

  for (let i = 0; i < TRAIL; i++) {
    const ghost = new THREE.LineSegments(
      edgeGeometry,
      new THREE.LineBasicMaterial({
        color: cfg.color,
        transparent: true,
        opacity: 0.8 * (1 - i / TRAIL),
        blending: THREE.AdditiveBlending,
        depthTest: false
      })
    );

    ghost.visible = false;
    scene.add(ghost);
    ghosts.push(ghost);
  }

  currentShape = n;
  history.length = 0;
}

// Barmoqlarni sanash.
function countFingers(lm) {
  const palmSize = fingerDistance(lm[0], lm[9]);
  let count = 0;

  // Bosh barmoq.
  if (fingerDistance(lm[4], lm[5]) > palmSize * 0.55) {
    count++;
  }

  // Ko‘rsatkich, o‘rta, nomsiz va jimjiloq.
  [[8,6], [12,10], [16,14], [20,18]].forEach(([tip,pip]) => {
    if (
      fingerDistance(lm[tip], lm[0]) >
      fingerDistance(lm[pip], lm[0]) * 1.1
    ) {
      count++;
    }
  });

  return count;
}

const hands = new Hands({
  locateFile: f =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  ctx.clearRect(0, 0, W, H);

  const detected = results.multiHandLandmarks || [];
  const now = performance.now();

  frames++;
  if (now - lastFps > 1000) {
    fps = Math.round(frames * 1000 / (now - lastFps));
    frames = 0;
    lastFps = now;
  }

  if (!detected.length) {
    noHandFrames++;

    if (noHandFrames > 10) {
      visible = false;
      stable = 0;
    }

    hud.textContent = `Qo‘l topilmadi · ${fps} FPS`;
    return;
  }

  noHandFrames = 0;

  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  detected.forEach(lm => {
    drawConnectors(ctx, lm, HAND_CONNECTIONS, {
      color: "rgba(255,255,255,0.55)",
      lineWidth: 1
    });

    drawLandmarks(ctx, lm, {
      color: "rgba(255,255,255,0.8)",
      radius: 1.5
    });
  });

  ctx.restore();

  const handsSorted = detected.map(lm => ({
    lm,
    x: 1 - lm[0].x
  })).sort((a,b) => a.x - b.x);

  let dominant;
  let other = null;

  if (handsSorted.length === 1) {
    dominant = handsSorted[0];
  } else {
    dominant = swapped
      ? handsSorted[0]
      : handsSorted[handsSorted.length - 1];

    other = swapped
      ? handsSorted[handsSorted.length - 1]
      : handsSorted[0];
  }

  const count = countFingers(dominant.lm);

  if (count === pending) {
    pendingFrames++;
  } else {
    pending = count;
    pendingFrames = 1;
  }

  if (pendingFrames >= 4) stable = count;

  // Musht shaklni yashiradi.
  if (stable === 0) {
    visible = false;
  } else if (SHAPES[stable]) {
    if (stable !== currentShape) buildShape(stable);

    visible = true;

    const p = dominant.lm[9];
    target.x = ((1 - p.x) * 2 - 1) * aspect;

    let topY = -9;

    [4,8,12,16,20].forEach(i => {
      topY = Math.max(topY, 1 - dominant.lm[i].y * 2);
    });

    target.y = Math.min(0.85, topY + 0.08 + 0.3 * scaleCur);
  } else {
    visible = false;
  }

  // Ikkinchi qo‘l bilan o‘lchamni boshqarish.
  if (other) {
    const lm = other.lm;

    const pinch =
      screenDistance(lm[4], lm[8]) /
      Math.max(screenDistance(lm[0], lm[9]), 0.001);

    const t = Math.min(1, Math.max(0, (pinch - 0.15) / 0.85));
    scaleTarget = 0.5 + t * 2;
  }

  hud.textContent =
    `Barmoqlar: ${stable} · ${fps} FPS · ` +
    (stable === 2 ? "Qizil neon yurak ❤️" :
     stable === 1 ? "To‘rtburchakli list" :
     stable === 3 ? "Uchburchak" :
     stable === 4 ? "Kub" :
     stable === 5 ? "Beshburchak" : "Musht");
});

let lastTime = performance.now();

function loop(time) {
  requestAnimationFrame(loop);

  if (!renderer) return;

  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  if (main) {
    if (visible && !wasVisible) {
      cur.x = target.x;
      cur.y = target.y;
      history.length = 0;
    }

    wasVisible = visible;
    main.visible = visible;

    cur.x += (target.x - cur.x) * 0.18;
    cur.y += (target.y - cur.y) * 0.18;

    scaleCur += (scaleTarget - scaleCur) * 0.2;

    rot.x += 0.8 * dt;
    rot.y += 1.2 * dt;
    rot.z += 0.3 * dt;

    const size = 0.35 * scaleCur;

    main.position.set(cur.x, cur.y, 0);
    main.rotation.set(rot.x, rot.y, rot.z);
    main.scale.setScalar(size);

    history.push({
      x: cur.x,
      y: cur.y,
      rx: rot.x,
      ry: rot.y,
      rz: rot.z,
      size
    });

    if (history.length > TRAIL * 2 + 4) history.shift();

    ghosts.forEach((g, i) => {
      const h = history[history.length - 1 - (i + 1) * 2];

      if (visible && h) {
        g.visible = true;
        g.position.set(h.x, h.y, 0);
        g.rotation.set(h.rx, h.ry, h.rz);
        g.scale.setScalar(h.size);
      } else {
        g.visible = false;
      }
    });
  }

  renderer.render(scene, camera);
}

document.getElementById("swap").onclick = () => {
  swapped = !swapped;
};

document.getElementById("start").onclick = async () => {
  const startButton = document.getElementById("start");
  startButton.disabled = true;
  startButton.textContent = "Kamera yuklanmoqda...";

  try {
    video.addEventListener("loadedmetadata", () => {
      stage.style.display = "block";
      stage.style.aspectRatio =
        `${video.videoWidth} / ${video.videoHeight}`;

      document.getElementById("swap").style.display = "inline-block";

      initThree();
      requestAnimationFrame(loop);
    }, { once: true });

    const cam = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      facingMode: "user",
      width: 480,
      height: 640
    });

    await cam.start();
  } catch (err) {
    console.error(err);
    hud.textContent = "Kamera ochilmadi. Ruxsat va HTTPS ni tekshiring.";
    startButton.disabled = false;
    startButton.textContent = "Qayta urinish";
  }
};
</script>
</body>
</html>
