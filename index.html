<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hand Figure</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --card:#f0f0f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --fg:#f5f5f5; --card:#222222; }
  }
  :root { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; text-align:center; }
  h1 { font-size:1.1rem; margin:10px 0 4px; }
  button { font-size:1rem; padding:10px 16px; border:0; border-radius:10px; background:#2563eb; color:#fff; margin:6px 4px; }
  button:disabled { opacity:.6; }
  button.sec { background:var(--card); color:var(--fg); }
  #msg { display:none; margin:8px 14px; padding:10px 12px; border-radius:10px; background:#b91c1c; color:#fff; font-size:14px; line-height:1.4; text-align:left; }
  #stage { position:relative; width:100%; max-width:640px; aspect-ratio:3/4; max-height:72vh; margin:6px auto; background:#000; display:none; overflow:hidden; border-radius:12px; }
  #video, #hand, #gl { position:absolute; left:0; top:0; width:100%; height:100%; }
  #video { object-fit:cover; transform:scaleX(-1); filter:brightness(.75); }
  #hud { position:absolute; left:8px; bottom:6px; right:8px; text-align:left; color:#fff; font-size:12px; text-shadow:0 0 4px #000; pointer-events:none; }
  small { display:block; margin:6px 14px; opacity:.8; line-height:1.5; }
</style>
</head>
<body>
<h1>Hand Figure</h1>
<button id="start">Kamerani yoqish</button>
<button id="swap" class="sec" style="display:none">Qo'llarni almashtirish</button>
<div id="msg"></div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="hand"></canvas>
  <canvas id="gl"></canvas>
  <div id="hud">Qo'lni ko'rsating</div>
</div>

<small>
  <b>Asosiy qo'l (ekranda o'ngdagi):</b> 2 barmoq = to'rtburchak, 3 = uchburchak, 4 = kub, 5 = 5 burchakli shakl.<br>
  <b>Ikkinchi qo'l:</b> bosh va ko'rsatkich barmoqni yaqinlashtirib/uzoqlashtirib o'lchamni o'zgartiring.<br>
  Shakl doim aylanadi va qo'l harakatiga ergashadi.
</small>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), stage = $('stage'), glCv = $('gl'), handCv = $('hand');
const hctx = handCv.getContext('2d');
const hud = $('hud'), msg = $('msg'), startBtn = $('start'), swapBtn = $('swap');

let swapped = false;
swapBtn.onclick = () => { swapped = !swapped; };

function showMsg(t) { msg.textContent = t || ''; msg.style.display = t ? 'block' : 'none'; }

function errText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return "Kameraga ruxsat berilmadi. Brauzer sozlamalaridan shu sayt uchun Kamerani 'Ruxsat berish' qiling va sahifani yangilang.";
  if (n === 'NotFoundError' || n === 'OverconstrainedError')
    return "Kamera topilmadi.";
  if (n === 'NotReadableError' || n === 'AbortError')
    return "Kamera band. Kamerani ishlatayotgan boshqa ilovani (Zoom, Telegram va h.k.) yoping va qayta urinib ko'ring.";
  return "Xatolik: " + (e && (e.message || e.name) || e);
}

/* ---------- Three.js ---------- */
let renderer, scene, camera, W = 1, H = 1, aspect = 1;
let fig, body, targetPos, targetScale = 1, curShape = null;

function resize() {
  W = stage.clientWidth || 1; H = stage.clientHeight || 1;
  aspect = W / H;
  handCv.width = W; handCv.height = H;
  if (renderer) {
    renderer.setSize(W, H, false);
    camera.left = -aspect; camera.right = aspect;
    camera.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);

const SHAPES = {
  2: { name: "to'rtburchak", color: 0x35e0ff, make: () => new THREE.BoxGeometry(1.3, 0.85, 0.08) },
  3: { name: "uchburchak", color: 0xffe135, make: () => { const g = new THREE.CylinderGeometry(0.85, 0.85, 0.1, 3); g.rotateX(Math.PI / 2); return g; } },
  4: { name: "kub", color: 0xff8a1f, make: () => new THREE.BoxGeometry(1, 1, 1) },
  5: { name: "5 burchakli shakl", color: 0xc04bff, make: () => { const g = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 5); g.rotateX(Math.PI / 2); return g; } }
};

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas: glCv, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(1, 2, 3);
  scene.add(dl);
  fig = new THREE.Group();
  fig.visible = false;
  scene.add(fig);
  targetPos = new THREE.Vector3();
  resize();
}

function setShape(n) {
  if (curShape === n) return;
  curShape = n;
  if (body) {
    fig.remove(body);
    body.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    body = null;
  }
  const def = SHAPES[n];
  if (!def) { fig.visible = false; return; }
  const geo = def.make();
  body = new THREE.Group();
  body.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.4, metalness: 0.1 })));
  body.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff })));
  fig.add(body);
  fig.visible = true;
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  if (fig && fig.visible) {
    fig.rotation.y += 0.03;
    fig.rotation.x += 0.015;
    fig.position.lerp(targetPos, 0.35);
    const s = fig.scale.x + (targetScale - fig.scale.x) * 0.25;
    fig.scale.setScalar(s);
  }
  if (renderer) renderer.render(scene, camera);
}

/* ---------- Qo'l hisob-kitoblari ---------- */
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function toScreen(p) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  return { x: W - (p.x * dw + ox), y: p.y * dh + oy }; // video aks ettirilgan
}

function countFingers(l) {
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const w = l[0];
  let n = 0;
  [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([t, p]) => { if (d(l[t], w) > d(l[p], w) * 1.05) n++; });
  if (d(l[4], l[17]) > d(l[3], l[17]) * 1.1) n++;
  return n;
}

let lastCount = -1, sameFrames = 0, stableCount = 0;

function onResults(res) {
  hctx.clearRect(0, 0, W, H);
  const raw = res.multiHandLandmarks || [];
  const hands = raw.map(lm => {
    const pts = lm.map(toScreen);
    return { lm, pts, cx: pts[9].x };
  }).sort((a, b) => a.cx - b.cx);

  // chizish
  hands.forEach(h => {
    hctx.strokeStyle = 'rgba(255,255,255,.8)'; hctx.lineWidth = 2;
    CONN.forEach(([a, b]) => { hctx.beginPath(); hctx.moveTo(h.pts[a].x, h.pts[a].y); hctx.lineTo(h.pts[b].x, h.pts[b].y); hctx.stroke(); });
    hctx.fillStyle = '#35e0ff';
    h.pts.forEach(p => { hctx.beginPath(); hctx.arc(p.x, p.y, 3, 0, 6.283); hctx.fill(); });
  });

  if (!hands.length) { hud.textContent = "Qo'lni ko'rsating"; setShape(null); lastCount = -1; return; }

  let primary, second = null;
  if (hands.length === 1) primary = hands[0];
  else { primary = swapped ? hands[0] : hands[hands.length - 1]; second = swapped ? hands[hands.length - 1] : hands[0]; }

  // barmoqlar soni (3 kadr barqaror bo'lsa o'zgaradi)
  const c = countFingers(primary.lm);
  if (c === lastCount) sameFrames++; else { sameFrames = 0; lastCount = c; }
  if (sameFrames >= 2) stableCount = c;
  setShape(stableCount);

  // joylashuv
  const p = primary.pts[9];
  targetPos.set((p.x / W * 2 - 1) * aspect, -(p.y / H * 2 - 1), 0);

  // o'lcham (ikkinchi qo'l)
  if (second) {
    const a = second.pts[4], b = second.pts[8];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    targetScale = Math.min(2.4, Math.max(0.4, 0.3 + dist / H * 6));
  }

  const def = SHAPES[stableCount];
  hud.textContent = "Barmoq: " + stableCount + (def ? " → " + def.name : "") + (second ? " | o'lchamni o'zgartiryapsiz" : "");
}

/* ---------- Ishga tushirish ---------- */
startBtn.onclick = async () => {
  showMsg('');
  if (typeof THREE === 'undefined' || typeof Hands === 'undefined') {
    showMsg("Kutubxonalar yuklanmadi. Internetni tekshirib, sahifani yangilang.");
    return;
  }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg("Kamera faqat https:// manzilda ishlaydi. Sahifani https:// bilan boshlanadigan link orqali, oddiy brauzerda (Safari/Chrome) oching.");
    return;
  }
  startBtn.disabled = true;

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
  } catch (e) {
    showMsg(errText(e));
    startBtn.disabled = false;
    return;
  }

  stage.style.display = 'block';
  swapBtn.style.display = 'inline-block';
  video.srcObject = stream;
  try { await video.play(); } catch (e) { showMsg(errText(e)); startBtn.disabled = false; return; }

  try {
    initThree();
    renderLoop();
  } catch (e) {
    showMsg("3D grafikani ishga tushirib bo'lmadi: " + (e.message || e));
    return;
  }

  hud.textContent = "Model yuklanmoqda…";
  let hands;
  try {
    hands = new Hands({ locateFile: f => "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + f });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);
    await hands.initialize();
  } catch (e) {
    showMsg("Qo'l aniqlash modeli yuklanmadi: " + (e.message || e) + ". Internetni tekshirib, qayta urinib ko'ring.");
    startBtn.disabled = false;
    return;
  }
  hud.textContent = "Qo'lni ko'rsating";
  startBtn.style.display = 'none';
  resize();

  let busy = false;
  (async function pump() {
    if (video.readyState >= 2 && !busy) {
      busy = true;
      try { await hands.send({ image: video }); } catch (e) {}
      busy = false;
    }
    requestAnimationFrame(pump);
  })();
};
</script>
</body>
</html>
